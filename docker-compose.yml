services:
  hysteria-checker:
    build: .
    ports:
      - "2112:2112"
    environment:
      - SUBSCRIPTION_URL=
      - CHECK_INTERVAL=300s
      - CHECK_METHOD=ip
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2112/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
